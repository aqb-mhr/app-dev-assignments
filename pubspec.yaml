name: lost_found
description: "Campus Lost & Found tracker for IBA Karachi, backed by Cloud Firestore."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Ranges let pub pick the newest Firebase release your Flutter SDK supports.
  firebase_core: ">=4.0.0 <6.0.0"
  cloud_firestore: ">=6.0.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  fake_cloud_firestore: ">=4.0.0 <5.0.0"

flutter:
  uses-material-design: true
